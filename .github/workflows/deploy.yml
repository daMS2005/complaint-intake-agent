name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:

env:
  REGION: us-central1
  SERVICE: complaint-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && vars.GCP_PROJECT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation; no stored keys
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push image
        run: |
          IMAGE=$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT }}/$SERVICE/app:${{ github.sha }}
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      - name: Deploy to Cloud Run
        run: gcloud run services update $SERVICE --region $REGION --image $IMAGE
      - name: Smoke test
        run: |
          URL=$(gcloud run services describe $SERVICE --region $REGION --format 'value(status.url)')
          curl -fsS $URL/health | tee /dev/stderr | grep -q '"backend":"gcp"'
