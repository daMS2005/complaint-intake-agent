<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Northwind Assistant</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display:flex; flex-direction:column; height:100dvh; }
  main { flex:1; min-height:0; width:100%; max-width:760px; margin:0 auto; padding:12px 16px 20px; display:flex; flex-direction:column; }
  #log { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:8px 0; }
  .msg { max-width:85%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#0d1117; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .chips button { color:var(--muted); border-radius:999px; padding:4px 12px; font-size:13px; cursor:pointer; text-align:left; }
  form { display:flex; gap:8px; } form input { flex:1; }
</style>
</head>
<body>
<header></header>
<main>
  <p class="note" id="intro"></p>
  <div id="log"></div>
  <div class="chips" id="chips"></div>
  <form><input id="q" autocomplete="off" maxlength="2000"><button class="primary">Send</button></form>
</main>
<script src="/static/nav.js"></script>
<script>
  const analyst = location.pathname === "/analyst";
  const cfg = analyst ? {
    title: "Northwind Analyst", endpoint: "/analyst",
    intro: "Internal analyst agent. It queries Northwind's cases (Firestore or SQLite) and public CFPB complaints (BigQuery or a bundled sample).",
    hello: "Ask me about complaint trends, risky cases, or how we compare to the industry.",
    chips: ["How many cases came in over the last 30 days, by urgency?", "Which high-urgency cases are still new?",
            "What are the top credit card complaint issues industry-wide?", "Compare our mortgage cases with the industry's top mortgage issues"],
  } : {
    title: "Northwind Assistant", endpoint: "/chat",
    intro: "Customer assistant. A coordinator agent routes you to intake, policy or case-status specialists. Northwind is a fictional bank.",
    hello: "Hi, I can answer questions about your accounts and cards, or help you report a problem. What do you need?",
    chips: ["There are two debit card charges of $480 I never made, from yesterday", "How long do you have to investigate an unauthorized debit charge?",
            "Can you refund an overdraft fee?", "What's the status of case C-SEED0004?"],
  };
  document.title = cfg.title;
  document.getElementById("intro").textContent = cfg.intro;
  const session = crypto.randomUUID(), log = document.getElementById("log"), q = document.getElementById("q");
  q.placeholder = analyst ? "Ask about cases or industry data…" : "Ask a question or describe the problem…";
  const add = (cls, text) => { const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text; log.append(d); log.scrollTop = log.scrollHeight; return d; };
  add("bot", cfg.hello);
  for (const c of cfg.chips) { const b = document.createElement("button"); b.textContent = c; b.onclick = () => { q.value = c; q.focus(); }; document.getElementById("chips").append(b); }
  document.querySelector("form").onsubmit = async e => {
    e.preventDefault();
    const text = q.value.trim(); if (!text) return;
    add("user", text); q.value = "";
    const pending = add("bot", "…");
    try {
      const r = await fetch(cfg.endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: session, message: text }) });
      pending.textContent = r.ok ? (await r.json()).reply || "(no reply)" : "Sorry, that didn't work. Try again.";
    } catch { pending.textContent = "Something went wrong. Try again."; }
  };
</script>
</body>
</html>
