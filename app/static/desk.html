<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Desk – Northwind Resolve</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  main { max-width: 1320px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 0; }
  @media (max-width: 1040px) { main { grid-template-columns: 1fr; } #detail { border-left: 0; border-top: 1px solid var(--line); padding: 24px 0 0; margin-top: 24px; } }
  .bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 16px; padding-right: 24px; }
  .bar label { font-weight: 500; }
  .bar #count { margin-left: auto; color: var(--muted); font-size: 14px; }
  .table { overflow-x: auto; padding-right: 24px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 14px; font-weight: 600; color: var(--muted); padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
  td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--surface); }
  tbody tr[aria-selected="true"] td { background: var(--green-soft); }
  td .issue { font-weight: 600; }
  .tag { font-size: 12px; font-weight: 600; color: var(--green); margin-top: 4px; }
  #detail { border-left: 1px solid var(--line); padding: 0 0 0 28px; align-self: start; position: sticky; top: 16px; display: grid; gap: 16px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #saved { font-size: 14px; color: var(--green); min-height: 1.4em; margin: 0; }
  @media (max-width: 640px) { main { padding: 16px; } .bar, .table { padding-right: 0; } th:nth-child(3), td:nth-child(3) { display: none; } }
</style>
</head>
<body>
<header></header>
<main>
  <section aria-labelledby="queue-title">
    <h2 id="queue-title" class="muted small" hidden>Case queue</h2>
    <div class="bar">
      <label>Show <select id="show"><option value="open">Open cases</option><option value="resolved">Resolved cases</option><option value="all">All cases</option></select></label>
      <label>Assigned <select id="assigned"><option value="">Anyone</option><option value="me">To me</option><option value="nobody">Nobody</option></select></label>
      <label>Urgency <select id="urgency"><option value="">Any</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>
      <button id="refresh">Refresh</button>
      <span id="count" aria-live="polite"></span>
    </div>
    <div class="table"><table>
      <thead><tr><th scope="col">Deadline</th><th scope="col">Case</th><th scope="col">Product</th><th scope="col">Urgency</th><th scope="col">Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <aside id="detail" aria-live="polite">
    <h2>Pick a case to work on</h2>
    <p class="muted">Open cases are sorted by deadline, so the most urgent is at the top.</p>
  </aside>
</main>
<script type="module">
  import { STATUS, api, clock, day, docs, esc, header, status, wireDownloads } from "/static/client.js";
  const me = await header("staff");
  let cases = [], selected = null;
  const wroteLast = c => c.timeline.at(-1)?.by === "customer" && c.status !== "resolved";
  const owner = c => (!c.assignee ? "Nobody" : c.assignee === me.uid ? "You" : "Another specialist");
  const URGENCY = { high: "High", medium: "Medium", low: "Low" };

  async function load() { cases = await api("/api/cases"); render(); if (selected) detail(); }

  function render() {
    const show = document.getElementById("show").value, urgency = document.getElementById("urgency").value;
    const assigned = document.getElementById("assigned").value;
    const shown = cases
      .filter(c => (show === "all" || (show === "open") === (c.status !== "resolved")) && (!urgency || c.urgency === urgency)
        && (!assigned || (assigned === "me" ? c.assignee === me.uid : !c.assignee)))
      .sort((a, b) => (show === "open" ? a.due.localeCompare(b.due) : b.created.localeCompare(a.created)));
    document.getElementById("count").textContent = `${shown.length} ${shown.length === 1 ? "case" : "cases"}`;
    document.getElementById("rows").innerHTML = shown.length ? shown.map(c => `
      <tr tabindex="0" data-id="${esc(c.id)}" aria-selected="${c.id === selected}">
        <td>${clock(c)}</td>
        <td><div class="issue">${esc(c.issue)}</div><div class="muted small num">${esc(c.id)}${c.assignee === me.uid ? ", assigned to you" : ""}</div>
          ${wroteLast(c) ? '<div class="tag">Customer wrote, waiting for you</div>' : ""}</td>
        <td class="small">${esc(c.product)}</td>
        <td class="small ${c.urgency === "high" ? "urgency-high" : ""}">${URGENCY[c.urgency] ?? esc(c.urgency)}</td>
        <td>${status(c.status)}</td>
      </tr>`).join("")
      : `<tr><td colspan="5" class="muted">No cases match these filters. Change "Show" or "Urgency" to see more.</td></tr>`;
    document.querySelectorAll("tbody tr[data-id]").forEach(r => {
      const open = () => { selected = r.dataset.id; render(); detail(); document.getElementById("reply")?.focus(); };
      r.onclick = open;
      r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } };
    });
  }

  function detail() {
    const c = cases.find(x => x.id === selected); if (!c) return;
    const kind = { reply: "Reply to customer", note: "Internal note", status: "Update", triage: "Triage changed", file: "Document", customer: "Customer wrote" };
    const ai = c.triage ? `${URGENCY[c.triage.urgency] ?? esc(c.triage.urgency)} urgency, ${esc(c.triage.regulations.join(", ") || "no rules")}, by ${esc(c.triage.model)}` : "Not recorded";
    document.getElementById("detail").innerHTML = `
      <div><h2>${esc(c.issue)}</h2>${clock(c)}</div>
      <dl>
        <dt>Case</dt><dd class="num">${esc(c.id)}</dd>
        <dt>Product</dt><dd>${esc(c.product)}</dd>
        <dt>Opened</dt><dd>${day(c.created)}</dd>
        <dt>Urgency</dt><dd class="${c.urgency === "high" ? "urgency-high" : ""}">${URGENCY[c.urgency] ?? esc(c.urgency)}</dd>
        <dt>Rules</dt><dd>${esc(c.regulations.join(", ") || "None flagged")}</dd>
        <dt>AI triage</dt><dd>${ai}</dd>
        <dt>Status</dt><dd>${status(c.status)}</dd>
        <dt>Assigned</dt><dd>${owner(c)} <button type="button" class="link" id="assign">${c.assignee === me.uid ? "Unassign" : "Assign to me"}</button></dd>
      </dl>
      <p style="margin:0">${esc(c.summary)}</p>
      ${docs(c)}
      <ol class="timeline">${c.timeline.map(e => `<li class="${esc(e.kind)}"><small>${day(e.at)}, ${kind[e.kind] ?? "Update"}</small>${esc(e.text)}</li>`).join("")}</ol>
      <form id="work" style="display:grid;gap:12px">
        <label>Reply to customer <span class="hint">They see this in their account.</span><textarea id="reply" maxlength="2000"></textarea></label>
        <label>Internal note <span class="hint">Only staff see this.</span><textarea id="note" maxlength="2000"></textarea></label>
        <div class="pair">
          <label>Urgency <select id="urg">${Object.entries(URGENCY).map(([v, t]) => `<option value="${v}" ${v === c.urgency ? "selected" : ""}>${t}</option>`).join("")}</select></label>
          <label>Rules <input id="rules" value="${esc(c.regulations.join(", "))}" aria-describedby="rules-hint"></label>
        </div>
        <span class="hint" id="rules-hint">Overriding the AI triage is logged. Adding or removing Reg E changes the deadline.</span>
        <label>Status <select id="st">${Object.entries(STATUS).map(([v, t]) => `<option value="${v}" ${v === c.status ? "selected" : ""}>${t}</option>`).join("")}</select></label>
        <button class="primary">Save changes</button>
        <p id="saved" role="status"></p>
      </form>`;
    wireDownloads(document.getElementById("detail"));
    document.getElementById("assign").onclick = async () => {
      Object.assign(c, await api(`/api/cases/${encodeURIComponent(c.id)}`, { method: "PATCH", body: JSON.stringify({ assign: c.assignee === me.uid ? "nobody" : "me" }) }));
      render(); detail();
    };
    document.getElementById("work").onsubmit = async e => {
      e.preventDefault();
      const v = id => document.getElementById(id).value.trim() || null;
      const rules = document.getElementById("rules").value.split(",").map(r => r.trim()).filter(Boolean);
      const body = { status: v("st"), reply: v("reply"), note: v("note"), urgency: v("urg"),
                     regulations: rules.join() === c.regulations.join() ? null : rules };
      const msg = document.getElementById("saved");
      if (!body.reply && !body.note && body.status === c.status && body.urgency === c.urgency && !body.regulations) {
        msg.textContent = "Nothing to save yet. Write a reply or a note, or change the status, urgency or rules."; return;
      }
      const button = e.submitter; button.disabled = true;
      try {
        Object.assign(c, await api(`/api/cases/${encodeURIComponent(c.id)}`, { method: "PATCH", body: JSON.stringify(body) }));
        render(); detail();
        document.getElementById("saved").textContent = body.reply ? "Changes saved. The customer can see your reply." : "Changes saved.";
      } catch {
        msg.textContent = "Changes weren't saved. Check your connection and save again."; button.disabled = false;
      }
    };
  }

  document.getElementById("show").onchange = document.getElementById("urgency").onchange = document.getElementById("assigned").onchange = render;
  document.getElementById("refresh").onclick = load;
  load();
</script>
</body>
</html>
