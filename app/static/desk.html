<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Desk · Northwind Resolve</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  main { max-width:1240px; margin:0 auto; padding:16px; display:grid; grid-template-columns:minmax(0, 1fr) 380px; gap:16px; }
  @media (max-width: 960px) { main { grid-template-columns:1fr; } }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .filters span { margin-left:auto; }
  .table { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; }
  td.wrap { white-space:normal; min-width:160px; }
  tr.row { cursor:pointer; } tr.row:hover, tr.sel { background:var(--panel); }
  aside { align-self:start; display:grid; gap:10px; position:sticky; top:12px; }
  textarea { width:100%; min-height:64px; }
</style>
</head>
<body>
<header></header>
<main>
  <section>
    <div class="filters">
      <select id="fs"><option value="open">Open cases</option><option value="">All cases</option><option value="resolved">Resolved</option></select>
      <select id="fu"><option value="">All urgencies</option><option>high</option><option>medium</option><option>low</option></select>
      <button id="refresh">Refresh</button>
      <span class="muted" id="count"></span>
    </div>
    <div class="table"><table>
      <thead><tr><th>Due</th><th>Case</th><th>Issue</th><th>Product</th><th>Urgency</th><th>Rules</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <aside class="panel" id="detail"><p class="muted">Open cases are sorted by legal deadline. Select one to work it.</p></aside>
</main>
<script type="module">
  import { api, day, esc, header } from "/static/client.js";
  await header("staff");
  let cases = [], selected = null;
  const due = c => {
    if (c.status === "resolved") return `<span class="muted">${day(c.due)}</span>`;
    const d = Math.ceil((new Date(c.due) - Date.now()) / 864e5);
    return d < 0 ? `<span class="pill overdue">${-d}d overdue</span>` : `<span class="pill ${d <= 2 ? "medium" : "low"}">in ${d}d</span>`;
  };
  async function load() { cases = await api("/api/cases"); render(); if (selected) detail(); }
  function render() {
    const fs = document.getElementById("fs").value, fu = document.getElementById("fu").value;
    const shown = cases.filter(c => (fs === "open" ? c.status !== "resolved" : !fs || c.status === fs) && (!fu || c.urgency === fu))
      .sort((a, b) => (fs === "open" ? a.due.localeCompare(b.due) : b.created.localeCompare(a.created)));
    document.getElementById("count").textContent = `${shown.length} of ${cases.length} cases`;
    document.getElementById("rows").innerHTML = shown.map(c => `
      <tr class="row ${c.id === selected ? "sel" : ""}" data-id="${esc(c.id)}">
        <td>${due(c)}</td><td>${esc(c.id)}</td><td class="wrap">${esc(c.issue)}</td><td class="wrap">${esc(c.product)}</td>
        <td><span class="pill ${esc(c.urgency)}">${esc(c.urgency)}</span></td><td>${esc(c.regulations.join(", "))}</td>
        <td><span class="pill ${esc(c.status)}">${esc(c.status.replace("_", " "))}</span></td></tr>`).join("");
    document.querySelectorAll("tr.row").forEach(r => (r.onclick = () => { selected = r.dataset.id; render(); detail(); }));
  }
  function detail() {
    const c = cases.find(x => x.id === selected); if (!c) return;
    document.getElementById("detail").innerHTML = `
      <h2>${esc(c.id)} · ${esc(c.issue)}</h2>
      <div class="muted">${esc(c.product)} · opened ${day(c.created)} · respond by ${day(c.due)} ${due(c)}</div>
      <div>${esc(c.summary)}</div>
      <div class="muted">AI triage: <span class="pill ${esc(c.urgency)}">${esc(c.urgency)}</span> · ${esc(c.regulations.join(", ") || "no rules flagged")}</div>
      <div class="timeline">${c.timeline.map(e => `<div class="${esc(e.kind)}"><span class="muted">${day(e.at)} · ${e.kind === "note" ? "internal note" : e.kind === "reply" ? "reply to customer" : "update"}</span><br>${esc(e.text)}</div>`).join("")}</div>
      <textarea id="reply" maxlength="2000" placeholder="Reply to the customer (they see this under My account)"></textarea>
      <textarea id="note" maxlength="2000" placeholder="Internal note (staff only)"></textarea>
      <label class="muted">Status <select id="st">${["new", "in_review", "resolved"].map(s => `<option value="${s}" ${s === c.status ? "selected" : ""}>${s.replace("_", " ")}</option>`).join("")}</select></label>
      <button class="primary" id="save">Save</button>`;
    document.getElementById("save").onclick = async () => {
      const v = id => document.getElementById(id).value.trim() || null;
      Object.assign(c, await api(`/api/cases/${encodeURIComponent(c.id)}`, { method: "PATCH", body: JSON.stringify({ status: v("st"), reply: v("reply"), note: v("note") }) }));
      render(); detail();
    };
  }
  document.getElementById("fs").onchange = document.getElementById("fu").onchange = render;
  document.getElementById("refresh").onclick = load;
  load();
</script>
</body>
</html>
