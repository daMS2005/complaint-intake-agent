<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insights · Northwind Resolve</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .split { display:grid; grid-template-columns:300px minmax(0, 1fr); gap:16px; }
  @media (max-width: 860px) { .split { grid-template-columns:1fr; } }
  #analyst { min-height:460px; }
  .bar { display:grid; grid-template-columns:1fr 32px; gap:8px; font-size:13px; padding:4px 0; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<header></header>
<main>
  <div class="tiles" id="tiles"></div>
  <div class="split">
    <section class="panel"><h2>Open cases by product</h2><div id="products"></div></section>
    <section class="panel"><h2>Ask the analyst</h2><div id="analyst"></div></section>
  </div>
</main>
<script type="module">
  import { api, chat, esc, header } from "/static/client.js";
  await header("staff");
  const s = await api("/api/stats");
  const tile = (n, label, alert) => `<div class="tile ${alert && n ? "alert" : ""}"><b>${n}</b><span class="muted">${label}</span></div>`;
  document.getElementById("tiles").innerHTML = tile(s.open, "open cases") + tile(s.overdue, "past their legal deadline", true) +
    tile(s.due_in_2_days, "due in the next 2 days") + tile(s.high_urgency_open, "high-urgency and open", true);
  document.getElementById("products").innerHTML = Object.entries(s.open_by_product).map(([p, n]) => `<div class="bar"><span>${esc(p)}</span><b>${n}</b></div>`).join("");
  chat(document.getElementById("analyst"), {
    endpoint: "/api/analyst",
    hello: "I can break down Northwind's cases, find risky ones, and compare them with complaints across the industry (CFPB data).",
    placeholder: "Ask about cases, deadlines or industry data…",
    chips: ["Which open cases are past their deadline?", "How many cases came in over the last 30 days, by urgency?",
            "What are the top credit card complaint issues industry-wide?", "Compare our mortgage cases with the industry's top mortgage issues"],
  });
</script>
</body>
</html>
