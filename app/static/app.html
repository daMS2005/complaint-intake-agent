<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant – Northwind Resolve</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  main { max-width: 1160px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 32px; height: calc(100dvh - 62px); }
  @media (max-width: 920px) { main { grid-template-columns: 1fr; height: auto; } }
  #assistant { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; min-height: 480px; }
  aside { overflow-y: auto; }
  .case { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 10px; color: var(--ink); text-decoration: none; }
  .case:hover h3 { text-decoration: underline; }
  .case-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; }
  .case h3 { font-size: 16px; margin: 0 0 2px; }
  .case.new-case { background: var(--green-soft); margin: 0 -12px; padding: 16px 12px; border-radius: 6px; }
</style>
</head>
<body>
<header></header>
<main>
  <section id="assistant" aria-label="Assistant"></section>
  <aside aria-labelledby="cases-title">
    <h2 id="cases-title">Your cases</h2>
    <div id="cases"><p class="muted">Loading your cases…</p></div>
  </aside>
</main>
<script type="module">
  import { api, chat, clock, esc, header, status } from "/static/client.js";
  await header("customer");
  let known = null;
  async function loadCases() {
    const list = await api("/api/my/cases");
    const fresh = known ? list.filter(c => !known.has(c.id)).map(c => c.id) : [];
    known = new Set(list.map(c => c.id));
    document.getElementById("cases").innerHTML = list.length ? list.map(c => `
      <a class="case ${fresh.includes(c.id) ? "new-case" : ""}" href="/cases?id=${encodeURIComponent(c.id)}">
        <div class="case-head">
          <div><h3>${esc(c.issue)}</h3><div class="muted small">Case ${esc(c.id)}</div><div>${status(c.status)}</div></div>
          ${clock(c).replace('class="clock', 'class="clock small-clock')}
        </div>
      </a>`).join("") + `<p class="small"><a href="/cases">Open My cases</a> to read replies, write back or add documents.</p>`
      : `<p class="muted">Nothing open. If something went wrong with an account, card or loan, describe it to the assistant and your case will show up here.</p>`;
  }
  chat(document.getElementById("assistant"), {
    endpoint: "/api/chat",
    label: "Message the assistant",
    hello: "Tell me what went wrong, ask about a fee or your rights, or ask where your cases stand.",
    placeholder: "Describe the problem or ask a question",
    suggestions: ["Two debit card charges of $480 I didn't make showed up yesterday", "Can you refund an overdraft fee?",
                  "How long do you have to investigate a charge I didn't make?", "Where do my cases stand?"],
    onReply: loadCases,
  });
  loadCases();
</script>
</body>
</html>
